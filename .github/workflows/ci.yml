name: CI

on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview, main]

permissions:
  contents: read

# Only cancel superseded PR runs; every commit on preview/main keeps a finished status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Match the npm major that writes package-lock.json locally; npm 10 and 11 resolve peers differently.
      - run: npm install -g npm@11

      - run: npm ci

      # .velite/ is gitignored and imported as @/.velite, so it must exist before typecheck and tests.
      - run: npm run velite

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test

      # Needs no secrets: Redis is only called at request time.
      - run: npm run build
